<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>
    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0.1" />
    </linearGradient>
    <style>
      .glow-circle {
        animation: pulse 6s ease-in-out infinite alternate;
      }
      .code-line {
        animation: slideIn 4s ease-in-out infinite alternate;
      }
      .cursor {
        animation: blink 1s step-end infinite;
      }
      @keyframes pulse {
        0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
        100% { transform: scale(1.1) translate(20px, -10px); opacity: 0.6; }
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 48px;
        fill: url(#title-grad);
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 20px;
        fill: #8b949e;
      }
      .tag-pill {
        font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
        font-size: 13px;
        fill: #c9d1d9;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="320" rx="16" fill="none" stroke="#30363d" stroke-width="2" />

  <!-- Dynamic / Animated Background Graphics (Kept behind and away from text) -->
  <g transform="translate(900, 160)">
    <circle class="glow-circle" cx="0" cy="0" r="120" fill="url(#accent-glow)" filter="blur(20px)" />
    <!-- Terminal Code Mockup on Right Side -->
    <rect x="-180" y="-90" width="360" height="180" rx="8" fill="#010409" stroke="#30363d" stroke-width="1.5" opacity="0.9" />
    <circle cx="-160" cy="-70" r="5" fill="#ff5f56" />
    <circle cx="-145" cy="-70" r="5" fill="#ffbd2e" />
    <circle cx="-130" cy="-70" r="5" fill="#27c93f" />
    <!-- Code Lines -->
    <text x="-160" y="-40" font-family="monospace" font-size="13" fill="#ff7b72">const <tspan fill="#d2a8ff">editor</tspan> = <tspan fill="#79c0ff">new</tspan> <tspan fill="#ffa657">AwesomeTextEditor</tspan>();</text>
    <text x="-160" y="-15" font-family="monospace" font-size="13" fill="#c9d1d9"><tspan fill="#79c0ff">await</tspan> editor.<tspan fill="#d2a8ff">openFile</tspan>(<tspan fill="#a5d6ff">"awesome.md"</tspan>);</text>
    <text x="-160" y="10" font-family="monospace" font-size="13" fill="#8b949e">// Speed, Extensibility &amp; Control</text>
    <text x="-160" y="35" font-family="monospace" font-size="13" fill="#79c0ff">editor<tspan fill="#c9d1d9">.</tspan><tspan fill="#d2a8ff">enableModalMode</tspan><tspan fill="#c9d1d9">();</tspan></text>
    <text x="-160" y="60" font-family="monospace" font-size="13" fill="#3fb950">✓ Ready to edit<tspan class="cursor" fill="#58a6ff">█</tspan></text>
  </g>

  <!-- Foreground Content: Title and Subtitle (Guaranteed high visibility and contrast) -->
  <g transform="translate(60, 110)">
    <!-- Main Title -->
    <text x="0" y="0" class="title-text">⚡ Awesome Text Editors</text>
    
    <!-- Subtitle -->
    <text x="0" y="38" class="subtitle-text">A curated list of top SaaS products &amp; open-source editing environments</text>
    <text x="0" y="66" class="subtitle-text">GUI Editors • Modal Workflows • Terminal Editors • Extensible Environments</text>

    <!-- Feature Tags / Badges -->
    <g transform="translate(0, 105)">
      <rect x="0" y="0" width="100" height="28" rx="14" fill="#1f6feb" fill-opacity="0.2" stroke="#1f6feb" stroke-width="1" />
      <text x="50" y="18" text-anchor="middle" class="tag-pill" fill="#58a6ff">🚀 VS Code</text>

      <rect x="112" y="0" width="90" height="28" rx="14" fill="#238636" fill-opacity="0.2" stroke="#238636" stroke-width="1" />
      <text x="157" y="18" text-anchor="middle" class="tag-pill" fill="#3fb950">⚡ Neovim</text>

      <rect x="214" y="0" width="80" height="28" rx="14" fill="#8957e5" fill-opacity="0.2" stroke="#8957e5" stroke-width="1" />
      <text x="254" y="18" text-anchor="middle" class="tag-pill" fill="#bc8cff">🦀 Zed</text>

      <rect x="306" y="0" width="90" height="28" rx="14" fill="#da3633" fill-opacity="0.2" stroke="#da3633" stroke-width="1" />
      <text x="351" y="18" text-anchor="middle" class="tag-pill" fill="#f85149">🌀 Helix</text>

      <rect x="408" y="0" width="95" height="28" rx="14" fill="#d29922" fill-opacity="0.2" stroke="#d29922" stroke-width="1" />
      <text x="455" y="18" text-anchor="middle" class="tag-pill" fill="#e3b341">💻 Vim</text>
    </g>
  </g>
</svg>
